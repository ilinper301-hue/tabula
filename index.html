<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tabula</title>
  <meta name="description" content="Planificación, agenda y evaluación para docentes.">
  <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1E1C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tabula">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tareas.css">
  <link rel="stylesheet" href="css/calendario.css">
  <link rel="stylesheet" href="css/grupos.css">
  <link rel="stylesheet" href="css/cuaderno.css">
  <link rel="stylesheet" href="css/planificacion.css">
  <link rel="stylesheet" href="css/bienvenida.css">
  <link rel="stylesheet" href="css/anecdotario.css">
  <link rel="stylesheet" href="css/programas.css">
  <link rel="stylesheet" href="css/encuestas.css">
  <link rel="stylesheet" href="css/documentos.css">
  <link rel="stylesheet" href="css/aula.css">
  <link rel="stylesheet" href="css/tutoria.css">
  <link rel="stylesheet" href="css/encuesta-public.css">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo
    try {
      var t = JSON.parse(localStorage.getItem('tabula:v1:set:theme') || '"system"');
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.dataset.theme = 'dark';
      var ac = JSON.parse(localStorage.getItem('tabula:v1:set:accent') || '"azul"');
      if (ac && ac !== 'terracota') document.documentElement.dataset.accent = ac;
      // Si hay bloqueo, se oculta el contenido desde el primer instante
      var lk = JSON.parse(localStorage.getItem('tabula:v1:set:lock') || 'null');
      if (lk && lk.enabled) document.documentElement.classList.add('is-locked');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Principal"></nav>
    <main class="main" id="main">
    <header class="mobile-brand" id="mobile-brand"></header>
      <div class="view" id="view"></div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Principal"></nav>
  <noscript>Tabula necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
