# Tabula · pruebas automáticas en cada cambio (rama o PR). Lo mismo que en local:  node --test tests/*.test.mjs
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de Tabula
        run: node --test tests/*.test.mjs
